{% load static %}
{% load custom_tags %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <header>
    {% block header %}
        {% include 'includes/_navbar.html' %}
        {% include 'includes/_messages.html' %}
    {% endblock header %}
    </header>

    <main>
    {% block main %}
        <h3>Блок "main"</h3>

    {% endblock main %}
    </main>

    <footer>
    {% block footer %}
        <h3>Блок "footer"</h3>
    {% endblock footer %}
    </footer>

    <script>
        // Чекаємо завантаження сторінки
        document.addEventListener("DOMContentLoaded", function() {
            // Знаходимо всі сповіщення на сторінці
            const alerts = document.querySelectorAll('.alert');

            alerts.forEach(function(alert) {
                // Встановлюємо таймер на 5000 мс (5 секунд)
                setTimeout(function() {
                    // Використовуємо вбудований метод Bootstrap для закриття
                    let bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }, 5000);
            });
        });
    </script>
</body>
</html>
